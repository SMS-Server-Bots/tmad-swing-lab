name: Validate TMAD PR before merge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: tmad-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validation dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -q -r 01_PROGRAMAS/alerts_bot/requirements.txt

      - name: Enforce version discipline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force --prune
          BASE="$(git merge-base HEAD origin/main)"
          HEAD_VERSION="$(tr -d '\r\n' < VERSION.txt)"
          BASE_VERSION="$(git show "$BASE:VERSION.txt" | tr -d '\r\n')"
          echo "Base version: $BASE_VERSION"
          echo "Head version: $HEAD_VERSION"

          set +e
          python .github/scripts/classify_release_impact.py "$BASE" HEAD
          RUNTIME_CHANGED=$?
          set -e

          if [[ "$RUNTIME_CHANGED" -ne 0 && "$HEAD_VERSION" == "$BASE_VERSION" ]]; then
            echo "::error::Runtime/source changed but VERSION.txt was not bumped."
            exit 1
          fi

      - name: Full pre-merge validation
        shell: bash
        run: bash .github/scripts/validate-tmad.sh
